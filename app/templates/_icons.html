{% macro icon(name, cls="") -%}

<polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>

<polyline points="4 17 4 20 20 20 20 17"/><polyline points="8 8 12 4 16 8"/><line x1="12" y1="4" x2="12" y2="15"/>

<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/>

<polyline points="13 3 4 14 11 14 10 21 20 10 13 10 13 3"/>

<polyline points="20 6 9 17 4 12"/>

<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>

<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>

<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>

<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
