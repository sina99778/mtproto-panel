{% macro icon(name, cls="") -%}
<svg xmlns="http://www.w3.org/2000/svg" class="icon {{ cls }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<path d="M12 3l8 3v6c0 4 -3.2 7.4 -8 9 -4.8 -1.6 -8 -5 -8 -9V6z"/><path d="M9.5 12l2 2 3.5 -4"/>

<polyline points="3 11 12 4 21 11"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1 -1v-9"/><path d="M9 21v-6h6v6"/>

<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
{%- elif name == "chart" -%}
<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="11" width="3" height="7" rx="1"/><rect x="11" y="7" width="3" height="11" rx="1"/><rect x="16" y="4" width="3" height="14" rx="1"/>

<circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4 -1.4M16.3 7.7l1.4 -1.4"/>

<path d="M9 21H6a2 2 0 0 1 -2 -2V5a2 2 0 0 1 2 -2h3"/><polyline points="15 17 20 12 15 7"/><line x1="20" y1="12" x2="9" y2="12"/>
{%- elif name == "moon" -%}
<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif name == "sun" -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>

<circle cx="9" cy="8" r="3"/><path d="M3 20c0 -3.3 2.7 -5 6 -5s6 1.7 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M21 20c0 -2.5 -1.5 -4 -3.5 -4.5"/>

<polyline points="4 17 4 20 20 20 20 17"/><polyline points="8 8 12 4 16 8"/><line x1="12" y1="4" x2="12" y2="15"/>
{%- elif name == "device" -%}
<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/>
{%- elif name == "world" or name == "globe" -%}
<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a16 16 0 0 1 0 18 16 16 0 0 1 0 -18"/>
{%- elif name == "bolt" -%}
<polyline points="13 3 4 14 11 14 10 21 20 10 13 10 13 3"/>
{%- elif name == "arrow-left" -%}
<line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/>
{%- elif name == "arrow-right" -%}
<line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/>
{%- elif name == "trash" -%}
<polyline points="4 7 20 7"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1 -1l1 -13"/><path d="M9 7V4a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/>

<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1 -2 -2V4a2 2 0 0 1 2 -2h9a2 2 0 0 1 2 2v1"/>
{%- elif name == "qrcode" -%}
<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h3v3M20 14v0M14 20h0M17 20h3v-3"/>

<path d="M9 15l6 -6"/><path d="M11 6l.5 -.5a4 4 0 0 1 6 6l-2 2"/><path d="M13 18l-.5 .5a4 4 0 0 1 -6 -6l2 -2"/>

<path d="M4 20h4l10 -10a2 2 0 0 0 -3 -3l-10 10v3z"/><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"/>

<path d="M20 11a8 8 0 0 0 -14 -4l-2 2"/><polyline points="4 5 4 9 8 9"/><path d="M4 13a8 8 0 0 0 14 4l2 -2"/><polyline points="20 19 20 15 16 15"/>
{%- elif name == "server" -%}
<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><line x1="7" y1="7" x2="7.01" y2="7"/><line x1="7" y1="17" x2="7.01" y2="17"/>
{%- elif name == "signal" -%}
<path d="M5 17a8 8 0 0 1 14 0"/><path d="M8 14a4 4 0 0 1 8 0"/><circle cx="12" cy="17" r="1.2"/>
{%- elif name == "key" -%}
<circle cx="8" cy="8" r="4"/><line x1="11" y1="11" x2="20" y2="20"/><line x1="17" y1="17" x2="19" y2="15"/><line x1="15" y1="15" x2="17" y2="13"/>

<polyline points="20 6 9 17 4 12"/>
{%- elif name == "x" -%}
<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
{%- elif name == "activity" -%}
<polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>
{%- elif name == "alert" -%}
<path d="M12 4l9 16H3z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17" x2="12.01" y2="17"/>
{%- elif name == "download" -%}
<path d="M4 17v3h16v-3"/><polyline points="8 11 12 15 16 11"/><line x1="12" y1="4" x2="12" y2="15"/>
{%- elif name == "dns" or name == "network" -%}
<rect x="4" y="4" width="16" height="6" rx="2"/><line x1="8" y1="7" x2="8.01" y2="7"/><path d="M12 10v4M8 14h8M8 14v3M16 14v3"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
