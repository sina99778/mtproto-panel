{% extends "base.html" %}
{% block content %}

<div class="page-header mb-3"><h2 class="page-title">تنظیمات</h2></div>

{% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="row justify-content-center">
<div class="col-lg-8">
<form method="post" action="/settings">

  <div class="card mb-3">
    <div class="card-header"><h3 class="card-title">سرور</h3></div>
    <div class="card-body">
      <label class="form-label">IP عمومی سرور (برای ساخت لینک‌ها)</label>
      <input name="server_public_ip" value="{{ server_public_ip }}" dir="ltr" class="form-control">
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header"><h3 class="card-title">Cloudflare Spectrum (اختیاری)</h3></div>
    <div class="card-body">
      <p class="text-secondary small">برای حالت کلودفلر. توکن باید دسترسی ویرایش Spectrum روی Zone را داشته باشد.</p>
      <div class="mb-3">
        <label class="form-label">API Token</label>
        <input name="cf_api_token" value="{{ cf_api_token }}" type="password" dir="ltr" class="form-control">
      </div>
      <div>
        <label class="form-label">Zone ID</label>
        <input name="cf_zone_id" value="{{ cf_zone_id }}" dir="ltr" class="form-control">
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header"><h3 class="card-title">تغییر رمز عبور</h3></div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6 mb-2">
          <input name="new_password" type="password" placeholder="رمز جدید" class="form-control">
        </div>
        <div class="col-md-6 mb-2">
          <input name="new_password2" type="password" placeholder="تکرار رمز جدید" class="form-control">
        </div>
      </div>
    </div>
    <div class="card-footer text-end">
      <button type="submit" class="btn btn-primary">ذخیره</button>
    </div>
  </div>

</form>
</div>
</div>
{% endblock %}
