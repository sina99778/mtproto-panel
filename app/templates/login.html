{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <form method="post" action="/login" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
    <h1 class="text-2xl font-bold text-center text-sky-400">🛡️ ورود به پنل</h1>
    {% if error %}<p class="bg-rose-900/50 text-rose-200 text-sm rounded-lg p-2 text-center">{{ error }}</p>{% endif %}
    <div>
      <label class="block text-sm mb-1">نام کاربری</label>
      <input name="username" autocomplete="username" required
             class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:border-sky-500 outline-none">
    </div>
    <div>
      <label class="block text-sm mb-1">رمز عبور</label>
      <input name="password" type="password" autocomplete="current-password" required
             class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:border-sky-500 outline-none">
    </div>
    <button class="w-full bg-sky-600 hover:bg-sky-500 rounded-lg py-2 font-semibold">ورود</button>
  </form>
</div>
{% endblock %}
