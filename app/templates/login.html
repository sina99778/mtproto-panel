{% extends "base.html" %}
{% block content_full %}
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="navbar-brand navbar-brand-autodark fw-bold fs-2 text-primary">🛡️ پنل MTProto</span>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">ورود به پنل</h2>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/login" autocomplete="off" novalidate>
          <div class="mb-3">
            <label class="form-label">نام کاربری</label>
            <input name="username" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">ورود</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
