<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پنل مدیریت MTProto{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@gh-pages/qrcode.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  {% if request.session.get('user') %}
  <nav class="bg-slate-900/80 border-b border-slate-800 sticky top-0 backdrop-blur z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/" class="font-bold text-lg text-sky-400">🛡️ پنل MTProto</a>
      <a href="/" class="hover:text-sky-300">داشبورد</a>
      <a href="/proxies/new" class="hover:text-sky-300">پروکسی جدید</a>
      <a href="/stats" class="hover:text-sky-300">آمار</a>
      <a href="/settings" class="hover:text-sky-300">تنظیمات</a>
      <span class="ms-auto text-xs text-slate-600">v{{ VERSION }}</span>
      <a href="/logout" class="text-rose-400 hover:text-rose-300">خروج</a>
    </div>
  </nav>
  {% endif %}
  <main class="max-w-5xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  <!-- QR modal -->
  <div id="qr-modal" class="hidden fixed inset-0 bg-black/70 items-center justify-center z-50" onclick="closeQR(event)">
    <div class="bg-white p-5 rounded-xl text-center">
      <div id="qrcode" class="flex justify-center"></div>
      <p class="text-slate-700 text-sm mt-3">برای اسکن با گوشی دیگر</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
