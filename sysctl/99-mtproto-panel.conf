# =====================================================================
#  MTProto Panel - Network tuning (BBR + low-latency TCP stack)
#  Applied automatically by install.sh via /etc/sysctl.d/
# =====================================================================

# --- Congestion control: enable Google BBR + fair queueing ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- Larger socket buffers for high-throughput / high-RTT links ---
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# --- Latency / loss resilience ---
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384

# --- Connection capacity (many concurrent proxy clients) ---
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# --- File descriptors / conntrack (best effort; may warn if module absent) ---
fs.file-max = 1048576
net.netfilter.nf_conntrack_max = 1048576

# --- IP forwarding (required for the tunneled / relay mode) ---
net.ipv4.ip_forward = 1
